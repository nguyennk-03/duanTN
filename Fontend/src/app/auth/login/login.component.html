
 <body class="authentication-bg authentication-bg-pattern">

  <div class="account-pages mt-5 mb-5">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6 col-xl-5">
                  <div class="card">

                      <div class="card-body p-4">

                          <div class="text-center w-75 m-auto">
                              <a href="index.html">
                                  <span><img src="../../../assets/images/logo.jpg" alt="" height="60"></span>
                              </a>
                              <p class="text-muted mb-4 mt-3">Nhập địa chỉ email và mật khẩu của bạn để truy cập vào..</p>
                          </div>

                          <h5 class="auth-title">ĐĂNG NHẬP</h5>

                          <form action="#">

                              <div class="form-group mb-3">
                                  <label for="emailaddress">Địa chỉ email</label>
                                  <input class="form-control" type="email" id="emailaddress" required="" placeholder="Nhập email của bạn">
                              </div>

                              <div class="form-group mb-3">
                                  <label for="password">Mật khẩu</label>
                                  <input class="form-control" type="password" required="" id="password" placeholder="Nhập mật khẩu của bạn">
                              </div>

                              <div class="form-group mb-3">
                                  <div class="custom-control custom-checkbox checkbox-info">
                                      <input type="checkbox" class="custom-control-input" id="checkbox-signin">
                                      <label class="custom-control-label" for="checkbox-signin">Nhớ mật khẩu</label>
                                  </div>
                              </div>

                              <div class="form-group mb-0 text-center">
                                  <button class="btn btn-danger btn-block" type="submit"> Đăng Nhập </button>
                              </div>

                          </form>

                          <div class="text-center">
                              <h5 class="mt-3 text-muted">Đăng nhập bằng</h5>
                              <ul class="social-list list-inline mt-3 mb-0">
                                  <li class="list-inline-item">
                                      <a href="javascript: void(0);" class="social-list-item border-primary text-primary"><i class="fab fa-facebook"></i></a>
                                  </li>
                                  <li class="list-inline-item">
                                      <a href="javascript: void(0);" class="social-list-item border-danger text-danger"><i class="fa-brands fa-google"></i></a>
                                  </li>
                                  <li class="list-inline-item">
                                      <a href="javascript: void(0);" class="social-list-item border-info text-info"><i class="fa-brands fa-twitter"></i></a>
                                  </li>
                                  <li class="list-inline-item">
                                      <a href="javascript: void(0);" class="social-list-item border-secondary text-secondary"><i class="fab fa-instagram"></i></a>
                                  </li>
                              </ul>
                          </div>

                      </div> <!-- end card-body -->
                  </div>
                  <!-- end card -->

                  <div class="row mt-3">
                      <div class="col-12 text-center">
                          <p> <a href="pages-recoverpw.html" class="text-muted ml-1">Quên mật khẩu?</a></p>
                          <p class="text-muted">Bạn chưa có tài khoản? <a [routerLink]="['/register']" class="text-muted ml-1"><b class="font-weight-semibold">Đăng Ký</b></a></p>
                      </div> <!-- end col -->
                  </div>
                  <!-- end row -->

              </div> <!-- end col -->
          </div>
          <!-- end row -->
      </div>
      <!-- end container -->
  </div>

</body>
