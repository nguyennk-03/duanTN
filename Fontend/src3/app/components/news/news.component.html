<div class="container-fluid my-4">
    <h2 class="text-center text-primary">Tin Tức Nổi Bật</h2>
    <div class="row">
        <div class="col-lg-3 col-md-6 col-sm-12" *ngFor="let news of newsList.slice(0, 4)">
            <div class="card h-100 shadow-sm">
                <img [src]="news.image" class="card-img-top" alt="news image">
                <div class="card-body">
                    <h5 class="card-title">{{ news.title }}</h5>
                    <p class="card-text">{{ news.content | slice:0:80 }}...</p>
                </div>
            </div>
        </div>
    </div>
</div>
