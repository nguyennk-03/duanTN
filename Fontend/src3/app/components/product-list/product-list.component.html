
<main class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar -->
    <aside class="col-md-3 border-end p-3">
      <h3>GIÁ</h3>
      <input type="range" class="form-range w-50 p-0 border-0" 
      [(ngModel)]="priceFilter" min="0" max="10000000" 
      (change)="applyFilters()" 
      style="height: 10px; accent-color: black;">

      <p>Giá tối đa: {{ priceFilter | currency:'VND' }}</p>
      
      <h3>Danh mục</h3>
      <div class="form-check" *ngFor="let category of ['illo', 'BOTTOMS', 'SANDALS', 'SHOES']">
        <input class="form-check-input" type="checkbox" id="{{ category }}">
        <label class="form-check-label" for="{{ category }}">{{ category }}</label>
      </div>
    </aside>

    <!-- Product List -->
    <section class="col-md-9">
      <div class="row g-4">
        <div class="col-md-3" *ngFor="let product of getFilteredProducts()">
          <div class="card h-100 text-center">
            <img [src]="product.image" [alt]="product.name" class="card-img-top">
            <div class="card-body">
              <p class="card-title">{{ product.name }}</p>
              <p class="text-danger fw-bold">
                <span class="discount">{{ product.price | currency:'VND' }}</span>
                <span class="text-decoration-line-through text-muted" *ngIf="product.oldPrice">{{ product.oldPrice | currency:'VND' }}</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
